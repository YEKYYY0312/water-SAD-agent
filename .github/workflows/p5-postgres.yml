name: p5-postgres

on:
  push:
  pull_request:

jobs:
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.2-bookworm@sha256:120230d04218c2acb30d7bb427798bd6c5beb0ef225883132aad653ccad44bce
        env:
          POSTGRES_DB: water_agent_test
          POSTGRES_USER: water_agent
          POSTGRES_PASSWORD: water_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U water_agent -d water_agent_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install uv==0.12.6 && uv sync --frozen --extra dev
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://water_agent:water_agent_test@127.0.0.1:5432/water_agent_test
        run: .venv/bin/python -m water_agent.webapp.lifecycle migrate
      - name: Run Step 38 through Step 41 tests
        env:
          P5_TEST_DATABASE_URL: postgresql+psycopg://water_agent:water_agent_test@127.0.0.1:5432/water_agent_test
          DATABASE_URL: postgresql+psycopg://water_agent:water_agent_test@127.0.0.1:5432/water_agent_test
        run: >-
          .venv/bin/pytest -q
          tests/test_p5_step38_storage.py
          tests/test_memory_contracts.py
          tests/test_memory_store.py
          tests/test_memory_write_policy.py
          tests/test_memory_recall.py
