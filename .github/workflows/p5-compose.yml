name: p5-compose

# Whole-stack Compose smoke test. Building the app image is slow, so this runs
# only on manual dispatch and on v* tags: it stays off every pull request.
#
# Ubuntu 26.04 的 runner 镜像把 Docker 从 28 升到 29、Compose 从 2.38 跨到 5.x，这个
# job 用到的 build / up --wait / ps --format / run --rm 全在这条线上，所以默认钉在
# ubuntu-24.04；手动触发时可以选 ubuntu-26.04 先试跑，再决定是否跟进。tag 触发没有
# inputs，回落到 ubuntu-24.04。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner 镜像（ubuntu-26.04 只用于试跑新镜像）
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04
        default: ubuntu-24.04
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install uv==0.12.6 && uv sync --frozen --extra dev
      # Secret files are created with a restrictive umask, written through
      # printf + redirection only, and never echoed: the values must not reach
      # the job log. An empty secret is a hard failure, not an empty file.
      - name: Create the compose secret files
        run: |
          umask 077
          test -n "${{ secrets.WATER_AGENT_POSTGRES_PASSWORD }}" || { echo "missing repository secret WATER_AGENT_POSTGRES_PASSWORD"; exit 1; }
          test -n "${{ secrets.WATER_AGENT_ADMIN_PASSWORD }}" || { echo "missing repository secret WATER_AGENT_ADMIN_PASSWORD"; exit 1; }
          mkdir -p secrets
          printf '%s' "${{ secrets.WATER_AGENT_POSTGRES_PASSWORD }}" > secrets/postgres_password
          printf '%s' "${{ secrets.WATER_AGENT_ADMIN_PASSWORD }}" > secrets/admin_password
          # The LLM credentials are optional: Compose needs every `file:` to
          # exist, but an empty one means "not configured" and the smoke run
          # then asserts the honest 424 instead of starting a billable call.
          printf '%s' "${{ secrets.WATER_AGENT_DEEPSEEK_API_KEY }}" > secrets/deepseek_api_key
          printf '%s' "${{ secrets.WATER_AGENT_DASHSCOPE_API_KEY }}" > secrets/dashscope_api_key
          # Compose (non-swarm) bind-mounts `file:` secrets with the host owner
          # and mode, so a 0600 runner-owned file is unreadable for the image's
          # uid 10001 and migrate falls over. Widen to read-only once the
          # values are on disk; the runner is single-tenant and discarded.
          chmod 0444 secrets/*
      - name: Show the compose version and validate the config
        run: |
          docker compose version
          docker compose config -q
      # The retrieval index is a build artifact (data/indexes/ is gitignored) and
      # the Dockerfile COPYs it in rather than building it, so a clean checkout
      # would ship an image that answers every question from the 2 KB fixture --
      # the smoke agentic_run_* checks exist to catch exactly that. Fetch the
      # pinned release asset and refuse to continue on a checksum mismatch.
      # Bump INDEX_TAG and INDEX_SHA256 together when the corpus is re-indexed.
      - name: Fetch the pinned retrieval index
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_TAG: index-qwen3.7-512-curated-v1
          INDEX_ASSET: qwen3.7__512__curated.tar.gz
          INDEX_SHA256: 06539f8dde420d4849c1c55a6615019d407e343b4c7b44e0708d6b338e66dc2d
        run: |
          gh release download "$INDEX_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$INDEX_ASSET" --dir /tmp/index
          echo "$INDEX_SHA256  /tmp/index/$INDEX_ASSET" | sha256sum -c -
          mkdir -p data/indexes
          tar -xzf "/tmp/index/$INDEX_ASSET" -C data/indexes
          ls -l data/indexes
      - name: Build the compose images
        run: docker compose build
      - name: Start the stack and wait for the app health
        run: |
          if docker compose up -d --wait; then
            echo "compose up -d --wait succeeded"
          else
            # Older compose releases have no --wait, and --wait can also time out.
            # Fall back to detaching and polling the app healthcheck ourselves.
            echo "compose up -d --wait unavailable or unhealthy; polling app health instead"
            docker compose up -d
            healthy=0
            for attempt in $(seq 1 60); do
              health="$(docker compose ps --format '{{.Health}}' app 2>/dev/null || true)"
              echo "poll ${attempt}: app health=${health:-unknown}"
              if [ "$health" = "healthy" ]; then
                healthy=1
                break
              fi
              sleep 5
            done
            if [ "$healthy" -ne 1 ]; then
              echo "the app container never became healthy"
              docker compose ps
              exit 1
            fi
          fi
      - name: Run the compose smoke service
        run: docker compose run --rm smoke
      # This job IS the release-gate environment: Docker and a live stack exist
      # here, so the harness runs with --release-gate, which turns ANY skipped
      # case into a failure. mem-p0-0042 backs the live stack up and verifies the
      # dump, so it must really execute rather than SKIP.
      - name: Run the memory_p0 harness as the release gate
        run: >-
          .venv/bin/python -m water_agent.harness.memory_eval
          data/eval/memory_p0.jsonl
          --out data/eval/reports/memory_p0_head.json
          --release-gate
      - name: Compare memory_p0 against the main baseline
        run: >-
          .venv/bin/python scripts/compare_memory_p0.py
          --head data/eval/reports/memory_p0_head.json
          --base data/eval/memory_p0_main.json
      # scripts/backup.sh and scripts/restore.sh are the P5 backup pair; this
      # step exercises the destructive half (restore into the running stack)
      # after the harness has verified the non-destructive half.
      - name: Back up and restore
        run: |
          bash scripts/backup.sh --out /tmp/water-agent-backup
          bash scripts/restore.sh --from /tmp/water-agent-backup --force
      # The image check runs WITHOUT --require-scanners on purpose: GitHub-hosted
      # runners carry no trivy/grype and cannot use docker scout unauthenticated,
      # so a strict scanner requirement belongs to the release gate only. Pass
      # --require-scanners here when the maintainer asks for it explicitly.
      - name: Check the built app image
        run: bash scripts/check_image.sh water-agent-app:local
      # Dump the logs before the teardown step, otherwise the containers (and
      # their logs) are already gone. The app, migrate and bootstrap-admin
      # processes never log secret values: they read the password from the
      # *_FILE paths, so this output is safe to keep.
      - name: Dump the compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear the stack down
        if: always()
        run: docker compose down -v
      - name: Upload the backup artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-backup
          path: /tmp/water-agent-backup
          retention-days: 7
