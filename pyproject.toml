[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-agent"
version = "0.1.0"
description = "给排水领域 AI Agent：规范问答 / 水力计算 / 图纸审查 / 计算书生成 / 材料统计"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=1.2.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "triviumdb>=0.8.0",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg>=3.2,<4",
    "psycopg-binary>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.7",
    "langchain-openai>=0.3",
    "openpyxl>=3.1,<4",
    "ezdxf>=1.4,<2",
    # P5-S48 多模态输入输出：.docx 读写（上传解析 + 计算书导出）与 .pdf 文本层提取。
    # pypdf 是默认 PDF 引擎，BSD-3 许可；pymupdf 提取质量更好但是 AGPL-3.0，
    # 对自托管商业部署有传染性，因此只作为 pdf-enhanced extra 显式 opt-in。
    "python-docx>=1.1,<2",
    "pypdf>=6.21.4,<7",
    # P5-S52：CAD 导出 PDF 的页面渲染（给视觉模型看图）。BSD-3/Apache-2.0，自带
    # PDFium 二进制轮子；刻意不用 AGPL 的 pymupdf（与 S48 同一决策）。
    "pypdfium2>=5,<6",
    # multipart/form-data 解析器。FastAPI 的 UploadFile/Form 缺它会在**请求期**抛
    # RuntimeError（不是 import 期），即"装不全也能启动、一上传就 500"，所以它是
    # 运行时必需依赖而不是可选项。
    "python-multipart>=0.0.20,<0.1",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
    "argon2-cffi>=23.1,<24",
    # P7-S9：SKILL.md 的 YAML frontmatter（safe_load）。此前只是 langchain-core 的传递依赖，
    # skills 包直接 import 它，必须显式声明——上游哪天去掉这条依赖，镜像就会在装配期 ImportError。
    "pyyaml>=6.0,<7",
    # 安全下限：去除涉及泄露中间 CA 私钥的旧信任根。
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
# AGPL-3.0。启用即承担相应开源义务，故不进运行时依赖、不做"装了就用"的自动探测：
# 只有显式设置 UPLOAD_PDF_ENGINE=pymupdf 才会走这条路径（documents/extractors.py）。
pdf-enhanced = ["pymupdf>=1.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

# P6-S1：建筑类型规则表随包分发（几何规划读它，不读仓库路径）。
[tool.setuptools.package-data]
"water_agent.drawing" = ["*.json"]
# P7-S9：内置 skill 随包分发（skill 库读包内路径，不读仓库 data/）。
"water_agent.skills" = ["builtin/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
