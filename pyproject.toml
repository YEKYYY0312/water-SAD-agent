[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "water-agent"
version = "0.1.0"
description = "给排水领域 AI Agent：规范问答 / 水力计算 / 图纸审查 / 计算书生成 / 材料统计"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=1.2.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "triviumdb>=0.8.0",
    "pydantic>=2.7",
    "langchain-openai>=0.3",
    "openpyxl>=3.1,<4",
    "ezdxf>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

