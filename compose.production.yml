# P5 Step 45 production overlay.
#
# Usage:
#   docker compose -f compose.yml -f compose.production.yml up -d
#   docker compose -f compose.yml -f compose.production.yml --profile production up -d
#
# The base file stays usable on its own for local development; this overlay adds
# the hardening a self-hosted production deployment needs.  What it deliberately
# does NOT do: it does not add a second set of services, does not change image
# tags or digests, and does not introduce a second source of truth for the
# database URL, migrations, or secrets — those stay defined once in compose.yml.
name: water-agent

services:
  postgres:
    # A runaway query must not be able to take the host down with it.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  bootstrap-admin:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  app:
    # SIGTERM is the graceful signal; the drain budget below covers the bounded
    # wait implemented by RunManager.close() (it cancels in-flight runs and
    # waits up to 20s for their terminal event).  uvicorn's own shutdown
    # timeout must be larger than that, otherwise uvicorn would abort the drain.
    stop_signal: SIGTERM
    stop_grace_period: 45s
    command:
      [
        "uvicorn",
        "water_agent.webapp.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-graceful-shutdown",
        "30",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
      ]
    environment:
      # 会话与 CSRF cookie 带上 Secure 标志。代码里的默认值是 false，因为基础
      # compose 要能在 http://localhost 上直接登录——Secure cookie 不会被浏览器
      # 发往明文来源，在开发环境固定 true 会让登录直接坏掉。真正需要它的是这里：
      # 本 overlay 的部署形态必然经 reverse-proxy 走 HTTPS（上面的 --proxy-headers
      # 就是为此），此时缺 Secure 意味着用户首次以 http:// 访问、在 Caddy 301 之前
      # 就已明文发出过会话 cookie。Caddyfile 的 HSTS 只能覆盖后续访问，兜不住第一跳。
      # 副作用：smoke 用 http 直连 app:8000，标准库 CookieJar 不会经 http 回传
      # Secure cookie，所以冒烟请在基础 compose 下跑，不要叠加本 overlay。
      WEB_SECURE_COOKIE: "true"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
        reservations:
          cpus: "0.25"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  local-model:
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  reverse-proxy:
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  smoke:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
