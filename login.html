<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给排水 Agent - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #1e3c72;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #1e3c72;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success.show {
            display: block;
        }

        .hint {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
        }

        .hint strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>给排水 Agent</h1>
            <p>TRACEABLE ENGINEERING WORKSPACE</p>
        </div>

        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" value="admin" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="见 secrets/admin_password" required>
            </div>

            <button type="submit" id="loginBtn">登录</button>
        </form>

        <div class="hint">
            <strong>提示：</strong><br>
            管理员密码存放在 <code>secrets/admin_password</code>，不在本页内。<br>
            复制到剪贴板：<br>
            <code>cat secrets/admin_password | pbcopy</code>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginBtn = document.getElementById('loginBtn');

        /**
         * 从 cookie 中获取 CSRF token
         * 登录成功后，后端会设置 wa_csrf cookie（非 HttpOnly，前端可读）
         * 所有状态变更请求（POST/PUT/PATCH/DELETE）都需要在 X-CSRF-Token header 中带上这个值
         */
        function getCsrfToken() {
            const name = 'wa_csrf=';
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name)) {
                    return cookie.substring(name.length);
                }
            }
            return null;
        }

        /**
         * 发送需要 CSRF 保护的请求
         * 用法示例：
         *   const result = await sendWithCsrf('/api/projects', {
         *       method: 'POST',
         *       body: JSON.stringify({ name: 'My Project' })
         *   });
         */
        window.sendWithCsrf = async function(url, options = {}) {
            const csrfToken = getCsrfToken();
            if (!csrfToken) {
                throw new Error('CSRF token not found. Please log in first.');
            }

            const headers = {
                'Content-Type': 'application/json',
                'X-CSRF-Token': csrfToken,
                ...(options.headers || {})
            };

            return fetch(url, {
                ...options,
                headers,
                credentials: 'include'
            });
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.ok) {
                    successMsg.textContent = '✅ 登录成功！正在跳转...';
                    successMsg.classList.add('show');

                    // 验证 CSRF token 是否已设置
                    setTimeout(() => {
                        const csrfToken = getCsrfToken();
                        if (csrfToken) {
                            console.log('✅ CSRF token ready:', csrfToken.substring(0, 10) + '...');
                        } else {
                            console.warn('⚠️  CSRF token not found in cookies');
                        }
                        window.location.href = 'http://127.0.0.1:8000/';
                    }, 1000);
                } else {
                    errorMsg.textContent = '❌ 登录失败: ' + (data.error?.message || '未知错误');
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            } catch (error) {
                errorMsg.textContent = '❌ 网络错误: ' + error.message;
                errorMsg.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });
    </script>
</body>
</html>
