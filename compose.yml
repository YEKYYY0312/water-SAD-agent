name: water-agent

services:
  postgres:
    image: postgres:18.2-bookworm@sha256:120230d04218c2acb30d7bb427798bd6c5beb0ef225883132aad653ccad44bce
    restart: unless-stopped
    environment:
      POSTGRES_DB: water_agent
      POSTGRES_USER: water_agent
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    # Explicit local tag: scripts/check_image.sh and the CI compose job
    # need a stable, known image name instead of the compose-derived one.
    image: water-agent-migrate:local
    build:
      context: .
    command: ["python", "-m", "water_agent.webapp.lifecycle", "migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://water_agent@postgres:5432/water_agent
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]

  bootstrap-admin:
    # Explicit local tag: scripts/check_image.sh and the CI compose job
    # need a stable, known image name instead of the compose-derived one.
    image: water-agent-bootstrap-admin:local
    build:
      context: .
    command: ["python", "-m", "water_agent.webapp.lifecycle", "bootstrap-admin"]
    environment:
      DATABASE_URL: postgresql+psycopg://water_agent@postgres:5432/water_agent
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - admin_password
      - postgres_password
    read_only: true
    tmpfs: [/tmp]

  app:
    # Explicit local tag: scripts/check_image.sh and the CI compose job
    # need a stable, known image name instead of the compose-derived one.
    # Single worker only: memory candidate store is in-process (15 min TTL).
    # For multi-worker, enable sticky sessions or persist candidates to Postgres.
    image: water-agent-app:local
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://water_agent@postgres:5432/water_agent
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      LOCAL_MODEL_ENABLED: ${LOCAL_MODEL_ENABLED:-false}
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://local-model:11434/v1}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-qwen3:8b}
      LOCAL_MODEL_COMPATIBILITY_REPORT: ${LOCAL_MODEL_COMPATIBILITY_REPORT:-}
      # LLM 凭据的第二优先级来源（第一是同名环境变量，第三是 app_credentials
      # 卷内的文件，由 Web 设置面板写入）。空文件等同于未配置，因此这两个
      # secret 可以只是占位符。解析顺序见 water_agent/config/credentials.py。
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DASHSCOPE_API_KEY_FILE: /run/secrets/dashscope_api_key
      # trace 的落盘位置。镜像内 /app/data 是只读的（Dockerfile 里 chmod -R a-w），
      # 不改这个变量的话每次运行结束 JsonTraceRecorder.finish() 都会 OSError，
      # 恰好在最需要现场的时候什么都不留。
      WATER_AGENT_TRACE_DIR: /var/lib/water-agent-traces
      # Web 扩展面板（P7-S6）的改动写进这份第三层 MCP 配置（只有启停与工具白名单，没有密钥），
      # 合并在部署覆盖层之后；挂在 /var/lib/water-agent 之下，随 scripts/backup.sh 一起备份。
      # 凭据槽位的值不在这里，在 app_credentials 卷。
      WATER_AGENT_MCP_WEB_LAYER: /var/lib/water-agent/mcp-admin/web_layer.json
      # Skill 库（P7-S9）：内置 skill 随包分发；运维 skill 放进只读卷 app_skills（一个 skill 一个
      # 子目录、里面一份 SKILL.md）。卷是空的也照常启动，只是没有运维 skill。面板只能启停，
      # 启停记录写在上面那份 Web 管理层里。
      WATER_AGENT_SKILLS: "on"
      WATER_AGENT_SKILLS_DIR: /etc/water-agent/skills
      # 已安装 skill（P7-S13）：运维在主机 shell 里用 skills-admin 从注册表取回并**人工批准**的 skill，放在只读卷
      # app_skills_installed（带 skills.lock.json）。应用侧每次加载都按原始字节重算 sha256 与大小，必须等于 lock，
      # 否则不加载（SKILL_TAMPERED / SKILL_UNLOCKED）。**app 不挂隔离区、不设注册表 URL**——应用进程不需要出站去取 skill，
      # 也没有任何取回 / 批准入口。卷是空的也照常启动。
      WATER_AGENT_SKILLS_INSTALLED_DIR: /var/lib/water-agent-skills-installed
      # MCP 远程 server 的 OAuth 授权（P7-S8）：授权服务器把管理员的浏览器带回的回调地址是
      # <WEB_PUBLIC_BASE_URL>/api/admin/mcp/oauth/callback（要在授权服务器上预先注册、精确匹配）。
      # 必须是 https://（本机调试允许 http://localhost）；不设 = 面板不提供「授权」按钮，不从请求的
      # Host 头推导。域名与 Caddy 的 WEB_DOMAIN 一致时通常写 https://$WEB_DOMAIN。
      WEB_PUBLIC_BASE_URL: ${WEB_PUBLIC_BASE_URL:-}
      # 对话模型端点（P7-S10，任意 OpenAI 兼容端点）。都空 = 缺省 DeepSeek（现状）。非缺省端点必须有通过的
      # 兼容性报告才能提问：WATER_AGENT_LLM_COMPATIBILITY_REPORT 指向它，或在设置面板运行兼容性检查（报告写进
      # app_credentials 卷）。Key 不经环境变量传（会出现在 `docker compose config` 里）：端点改到别家后在设置面板
      # 填 WATER_AGENT_LLM_API_KEY（只写不读）；DeepSeek 的 Key 不会发给别的服务商。
      WATER_AGENT_LLM_BASE_URL: ${WATER_AGENT_LLM_BASE_URL:-}
      WATER_AGENT_LLM_MODEL: ${WATER_AGENT_LLM_MODEL:-}
      WATER_AGENT_LLM_COMPATIBILITY_REPORT: ${WATER_AGENT_LLM_COMPATIBILITY_REPORT:-}
      WATER_AGENT_LLM_TIMEOUT_SECONDS: ${WATER_AGENT_LLM_TIMEOUT_SECONDS:-}
      WATER_AGENT_LLM_PRICE: ${WATER_AGENT_LLM_PRICE:-}
      # embedding 端点（缺省百炼 qwen3.7-text-embedding）：换 embedding 模型必须重建索引（index_meta.json 校验）。
      WATER_AGENT_EMBEDDING_BASE_URL: ${WATER_AGENT_EMBEDDING_BASE_URL:-}
      WATER_AGENT_EMBEDDING_MODEL: ${WATER_AGENT_EMBEDDING_MODEL:-}
      # 检索模式 auto|hybrid|text（空 = auto）：auto 下没配 embedding 或与索引不匹配时走关键词检索（BM25，
      # 不是语义检索，界面如实标出）；hybrid 强制混合检索，缺 embedding 即拒绝提问。
      WATER_AGENT_RETRIEVAL_MODE: ${WATER_AGENT_RETRIEVAL_MODE:-}
      # 联网搜索（P7-S12）：**缺省关闭**（外发默认关，与 skills 不同）。开启需同时设 provider（searxng / brave）与基址；
      # 基址是唯一出口，模型只控制搜索词。brave 等有密钥的 provider 在设置面板填 WATER_AGENT_WEB_SEARCH_API_KEY（只写不读，
      # 不经环境变量传）。searxng 自托管在内网时设 WATER_AGENT_WEB_SEARCH_ALLOW_PRIVATE=1（只放行回环与私有网段，
      # 云元数据地址永远拒绝）。用户还要对每一条消息勾选「联网」才会搜索；查询会发往该服务，数据出境由运维评估。
      WATER_AGENT_WEB_SEARCH: ${WATER_AGENT_WEB_SEARCH:-}
      WATER_AGENT_WEB_SEARCH_PROVIDER: ${WATER_AGENT_WEB_SEARCH_PROVIDER:-}
      WATER_AGENT_WEB_SEARCH_BASE_URL: ${WATER_AGENT_WEB_SEARCH_BASE_URL:-}
      WATER_AGENT_WEB_SEARCH_ALLOW_PRIVATE: ${WATER_AGENT_WEB_SEARCH_ALLOW_PRIVATE:-}
    secrets:
      - postgres_password
      - deepseek_api_key
      - dashscope_api_key
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-admin:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - app_uploads:/var/lib/water-agent/uploads
      - app_exports:/var/lib/water-agent/exports
      - app_mcp_admin:/var/lib/water-agent/mcp-admin
      # Web 设置面板写入的密钥落在这里。刻意不放进 /var/lib/water-agent：
      # scripts/backup.sh 打包的是那个目录整体（tar -C /var/lib/water-agent .），
      # 挂进去会把密钥明文写进 user_files.tar。
      - app_credentials:/var/lib/water-agent-credentials
      # 运行 trace 同理放在 /var/lib/water-agent 之外：trace 里有用户问题与答案原文
      # （见 docs/design/p5-release-data-inventory.md 的 E 类），不该随用户文件备份流转。
      - app_traces:/var/lib/water-agent-traces
      # 运维 skill 是部署配置不是用户数据：只读挂载，放在 /var/lib/water-agent 之外，不随备份流转。
      - app_skills:/etc/water-agent/skills:ro
      # 已安装 skill：部署配置不是用户数据，只读挂载，放在 /var/lib/water-agent 之外，不随备份流转
      # （靠重新 fetch + approve 重建；lock 随卷存在）。写入只发生在 skills-admin 一次性容器里。
      - app_skills_installed:/var/lib/water-agent-skills-installed:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live'); urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Skill 下载的运维入口（P7-S13）。**只在 profile `ops` 下**，默认不启动；运维按需起一次性容器：
  #   docker compose --profile ops run --rm skills-admin fetch <name>@<version>
  #   docker compose --profile ops run --rm -it skills-admin approve <name>@<version> --sha256 <64 位摘要>
  # `approve` / `rollback` / `remove` 必须交互终端（`-it`，键入 skill 名确认），没有 --yes，没有任何旁路。
  # 复用 app 镜像（**不新增构建服务**——check_image.sh 与 .dockerignore 的约束不变）。注册表基址只在这里，不给 app。
  # 不挂 secrets、不连 postgres：它既不需要密钥也不需要数据库。安装区读写，隔离区与审计各一个卷。
  skills-admin:
    image: water-agent-app:local
    profiles: [ops]
    restart: "no"
    command: ["python", "-m", "water_agent.skills.cli", "--help"]
    environment:
      WATER_AGENT_SKILL_REGISTRY_URL: ${WATER_AGENT_SKILL_REGISTRY_URL:-}
      WATER_AGENT_SKILL_REGISTRY_ALLOW_PRIVATE: ${WATER_AGENT_SKILL_REGISTRY_ALLOW_PRIVATE:-}
      WATER_AGENT_SKILLS_INSTALLED_DIR: /var/lib/water-agent-skills-installed
      WATER_AGENT_SKILLS_QUARANTINE_DIR: /var/lib/water-agent-skills-quarantine
      WATER_AGENT_SKILLS_STATE_DIR: /var/lib/water-agent-skills-state
      # 同名预检要读运维目录（只读）；与 app 看到的是同一份
      WATER_AGENT_SKILLS_DIR: /etc/water-agent/skills
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - app_skills_installed:/var/lib/water-agent-skills-installed
      - skills_quarantine:/var/lib/water-agent-skills-quarantine
      - skills_state:/var/lib/water-agent-skills-state
      - app_skills:/etc/water-agent/skills:ro

  # Smoke test (Step 45).  It is NOT behind a profile on purpose: the task book's
  # acceptance command is a bare `docker compose run --rm smoke`, and Compose v2
  # refuses to run a service whose profile is inactive.  It is a one-shot
  # (`restart: "no"`) that HTTP-checks the deployed app and exits.
  smoke:
    # Explicit local tag: scripts/check_image.sh and the CI compose job
    # need a stable, known image name instead of the compose-derived one.
    image: water-agent-smoke:local
    build:
      context: .
    command: ["python", "-m", "water_agent.webapp.smoke"]
    restart: "no"
    environment:
      SMOKE_BASE_URL: http://app:8000
      SMOKE_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      SMOKE_EXPECTED_MIGRATION_HEAD: "0008_step15_model_choice"
      # 冒烟自己要在本容器内跑一次 agentic run（见 webapp/smoke.py 的
      # _run_agentic_probe），运行收尾要写 trace。这里指向下面的 tmpfs：
      # 根文件系统只读，app 的 app_traces 卷也不该被冒烟写脏。
      WATER_AGENT_TRACE_DIR: /tmp/water-agent-traces
      # 冒烟的 agentic 探针按与 app 相同的检索模式配置判定（P7-S10），并断言运行状态里的 retrieval_mode 与之一致
      WATER_AGENT_RETRIEVAL_MODE: ${WATER_AGENT_RETRIEVAL_MODE:-}
      WATER_AGENT_EMBEDDING_BASE_URL: ${WATER_AGENT_EMBEDDING_BASE_URL:-}
      WATER_AGENT_EMBEDDING_MODEL: ${WATER_AGENT_EMBEDDING_MODEL:-}
    depends_on:
      app:
        condition: service_healthy
    secrets:
      - admin_password
    read_only: true
    tmpfs: [/tmp]

  reverse-proxy:
    image: caddy:2.11.1-alpine@sha256:3b2a0196e0687279c14c27adff9fc6b44acfa318dbb97eaebe385bdf99e5364c
    profiles: [production]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    command:
      - sh
      - -ec
      - |
        test -n "$$WEB_DOMAIN" || { echo "WEB_DOMAIN is required for the production profile"; exit 64; }
        test -n "$$CADDY_EMAIL" || { echo "CADDY_EMAIL is required for the production profile"; exit 64; }
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    read_only: true
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  local-model:
    # Official Ollama image.  This service is opt-in and does not download a
    # model automatically; an operator must pull a model and run the Step 46
    # compatibility probe before setting LOCAL_MODEL_ENABLED=true.
    image: ollama/ollama:0.13.3
    profiles: [local-model]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - local_model_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  admin_password:
    file: ./secrets/admin_password
  # 这两个是可选凭据：Compose 的 `file:` 要求文件存在，所以首次部署需
  # `touch secrets/deepseek_api_key secrets/dashscope_api_key`，空文件由
  # 加载器视为未配置。详见 secrets/README.md。
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  dashscope_api_key:
    file: ./secrets/dashscope_api_key

volumes:
  postgres_data:
  app_uploads:
  app_exports:
  app_mcp_admin:
  app_credentials:
  app_traces:
  app_skills:
  # P7-S13：已安装 skill（含 skills.lock.json）/ 隔离区（未批准的第三方文本）/ 审计。三者都在 /var/lib/water-agent 之外，
  # 不进 scripts/backup.sh 的备份范围（隔离区是未批准文本、审计是运维记录；安装区是部署配置，靠重新 fetch + approve 重建）。
  app_skills_installed:
  skills_quarantine:
  skills_state:
  local_model_data:
  caddy_data:
  caddy_config:
